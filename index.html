<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="#">
        <img src="./media/logoBright.svg" alt="Weather app" class="logo" />
      </a>
      <div class="cityButtonWrap">
        <img src="./media/maps-arrow-diagonal.svg" alt="" />
        <button type="button" class="cityButton">Wybrane Miasto</button>
        <img src="./media/nav-arrow-down.svg" alt="" />
      </div>
    </header>
    <main>
      <div class="currentCity margin">
        <h1 class="city">Wybrane Pogoda</h1>
        <p class="currentCityDescription">Wybrane, województwo wybrane</p>
      </div>
      <div class="currentWeather">
        <div class="currentTop">
          <div class="currentLeft">
            <p class="mainTemp">-99&deg;</p>
            <span class="znak">C</span>
          </div>
          <div class="currentRight">
            <img src="./media/sun.svg" class="weatherIcon" />
            <p class="iconDescription">Słonecznie</p>
          </div>
        </div>
        <div class="currentBottom">
          <span class="feelsTemp">Odczuwalna: -99&deg;C</span>
          <span class="highTemp">H: -99&deg;C</span>
          <span class="lowTemp">L: -99&deg;C</span>
          <p class="rainProbability">Prawdopodobieństwo opadów: 999%</p>
        </div>
      </div>
      <section class="citySearchWrap">
        <div class="citySearchTop">
          <button class="searchBackButton">
            <img
              class="backArrow"
              src="./media/nav-arrow-left.svg"
              alt="powrót"
            />
          </button>
          <div class="searchBox">
            <img src="./media/search.svg" />
            <input type="text" placeholder="Wyszukaj lokalizacje" />
            <img src="./media/xmark-circle-solid.svg" />
          </div>
        </div>
        <div class="favoriteSearch margin">
          <p>Twoje miejsca:</p>
          <div class="cityWrap">
            <img src="./media/map-pin.svg" class="pin" />
            <button>
              <span class="cityName">Łódź</span>
              <span class="cityVoid">województwo Łódzkie, Polska</span>
            </button>
            <img src="./media/star.svg" />
            <img src="./media/xmark.svg" />
          </div>
          <div class="cityWrap">
            <img src="./media/map-pin.svg" class="pin" />
            <button>
              <span class="cityName">Nowy Targ</span>
              <span class="cityVoid">województwo małopolskie, Polska</span>
            </button>
            <img src="./media/star.svg" />
            <img src="./media/xmark.svg" />
          </div>
        </div>
        <div class="searchResults margin">
          <p>Wyszukane miasta:</p>
          <div class="cityWrap">
            <img src="./media/map-pin.svg" class="pin" />
            <button>
              <span class="cityName">Nowy Targ</span>
              <span class="cityVoid">województwo małopolskie, Polska</span>
            </button>
            <img src="./media/star.svg" />
          </div>
          <div class="cityWrap">
            <img src="./media/map-pin.svg" class="pin" />
            <button>
              <span class="cityName">Nowy Targ</span>
              <span class="cityVoid">województwo małopolskie, Polska</span>
            </button>
            <img src="./media/star.svg" />
          </div>
        </div>
      </section>
      <div class="wide"></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
